name: Build Packages

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  build-gem:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3'
        bundler-cache: true

    - name: Build gem
      run: gem build mysql_change_database_encoding.gemspec

    - name: Upload gem artifact
      uses: actions/upload-artifact@v4
      with:
        name: gem-package
        path: "*.gem"

  build-rpm:
    runs-on: ubuntu-latest
    container: 
      image: fedora:latest
    
    steps:
    - name: Install dependencies
      run: |
        dnf install -y git rpm-build rpm-devel rpmlint rpmdevtools ruby ruby-devel gcc gcc-c++ make
        gem install bundler

    - uses: actions/checkout@v4

    - name: Create RPM build environment
      run: |
        rpmdev-setuptree

    - name: Build RPM
      run: |
        ./script/build-rpm --version "0.0.0-dev-$(git rev-parse --short HEAD)"

    - name: Upload RPM artifacts
      uses: actions/upload-artifact@v4
      with:
        name: rpm-packages
        path: "*.rpm"

  build-deb:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y dpkg-dev ruby-dev build-essential
        sudo gem install bundler

    - name: Build DEB
      run: |
        ./script/build-deb --version "0.0.0-dev-$(git rev-parse --short HEAD)"

    - name: Upload DEB artifacts
      uses: actions/upload-artifact@v4
      with:
        name: deb-packages
        path: "*.deb"

  build-docker:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      run: |
        VERSION="0.0.0-dev-$(git rev-parse --short HEAD)"
        docker buildx build \
          --platform linux/amd64 \
          -t mysql-change-database-encoding:$VERSION \
          -t mysql-change-database-encoding:latest \
          .

    - name: Test Docker image
      run: |
        VERSION="0.0.0-dev-$(git rev-parse --short HEAD)"
        docker run --rm mysql-change-database-encoding:$VERSION --help
