name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      packages: write

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Extract version from tag
      id: version
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

    # Build RPM
    - name: Build RPM in container
      run: |
        docker run --rm \
          -v "$PWD:/workspace" \
          -w /workspace \
          fedora:latest \
          bash -c "
            dnf install -y rpm-build rpm-devel rpmdevtools ruby ruby-devel gcc gcc-c++ make tar gzip
            gem install bundler
            rpmdev-setuptree
            ./script/build-rpm --version ${{ steps.version.outputs.version }}
          "

    # Build DEB
    - name: Build DEB
      run: |
        sudo apt-get update
        sudo apt-get install -y dpkg-dev ruby-dev build-essential
        sudo gem install bundler
        ./script/build-deb --version ${{ steps.version.outputs.version }}

    # Set up Docker for multi-arch builds
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_TOKEN }}

    - name: Log in to GitHub Container Registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # Build and push Docker images
    - name: Build and push Docker images
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: ${{ github.event_name != 'pull_request' }}
        tags: |
          durableprogramming/mysql-change-database-encoding:${{ steps.version.outputs.version }}
          durableprogramming/mysql-change-database-encoding:latest
          ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
          ghcr.io/${{ github.repository }}:latest

    # Create GitHub Release
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.version.outputs.tag }}
        name: mysql-change-database-encoding ${{ steps.version.outputs.version }}
        body: |
          Release ${{ steps.version.outputs.version }}

          ## Changes
          See the commit history for detailed changes in this release.

          ## Downloads
          - **RPM Package**: mysql-change-database-encoding-${{ steps.version.outputs.version }}-1.noarch.rpm
          - **DEB Package**: mysql-change-database-encoding_${{ steps.version.outputs.version }}_all.deb
          - **Docker Image**: `durableprogramming/mysql-change-database-encoding:${{ steps.version.outputs.version }}`

          ## Installation

          ### RPM (RedHat/CentOS/Fedora):
          ```bash
          wget https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/mysql-change-database-encoding-${{ steps.version.outputs.version }}-1.noarch.rpm
          sudo rpm -i mysql-change-database-encoding-${{ steps.version.outputs.version }}-1.noarch.rpm
          ```

          ### DEB (Ubuntu/Debian):
          ```bash
          wget https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/mysql-change-database-encoding_${{ steps.version.outputs.version }}_all.deb
          sudo dpkg -i mysql-change-database-encoding_${{ steps.version.outputs.version }}_all.deb
          ```

          ### Docker:
          ```bash
          docker run --rm durableprogramming/mysql-change-database-encoding:${{ steps.version.outputs.version }} --help
          ```

          ## Usage
          See the [README.md](README.md) for detailed usage instructions.
        files: |
          *.rpm
          *.deb
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}