name: Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        ruby-version: ['2.7', '3.0', '3.1', '3.2']
        mysql-version: ['5.7', '8.0']

    services:
      mysql:
        image: mysql:${{ matrix.mysql-version }}
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: test_db
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Ruby ${{ matrix.ruby-version }}
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby-version }}
        bundler-cache: true

    - name: Wait for MySQL
      run: |
        echo "Waiting for MySQL to be ready..."
        for i in {1..30}; do
          if mysqladmin ping -h 127.0.0.1 -u root -ppassword --silent; then
            echo "MySQL is ready!"
            break
          fi
          echo "Attempt $i: MySQL not ready yet, waiting..."
          sleep 2
        done
        
        # Verify connection
        mysql -h 127.0.0.1 -u root -ppassword -e "SELECT VERSION();"

    - name: Set up test database
      run: |
        mysql -h 127.0.0.1 -u root -ppassword -e "
          CREATE DATABASE IF NOT EXISTS test_db;
          GRANT ALL PRIVILEGES ON test_db.* TO 'root'@'%';
          FLUSH PRIVILEGES;
        "

    - name: Run tests
      run: |
        # Run the available test
        if [ -f test/database_encoding_changer_table_test.rb ]; then
          bundle exec ruby -Itest test/database_encoding_changer_table_test.rb
        else
          echo "No tests found, running basic syntax check"
          ruby -c mysql_change_database_encoding.rb
          ruby -c lib/*.rb
        fi
      env:
        MYSQL_HOST: 127.0.0.1
        MYSQL_PORT: 3306
        MYSQL_USER: root
        MYSQL_PASSWORD: password
        MYSQL_DATABASE: test_db

    - name: Test CLI help
      run: |
        ruby mysql_change_database_encoding.rb --help

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.1'
        bundler-cache: true

    - name: Check syntax
      run: |
        ruby -c mysql_change_database_encoding.rb
        find lib -name "*.rb" -exec ruby -c {} \;
        find test -name "*.rb" -exec ruby -c {} \; || true

    - name: Check for basic code issues
      run: |
        # Check for common Ruby issues
        echo "Checking for basic code quality issues..."
        
        # Check for TODO/FIXME comments
        echo "TODO/FIXME comments found:"
        grep -rn "TODO\|FIXME" . --include="*.rb" || echo "None found"
        
        # Check for hardcoded credentials (basic check)
        echo "Checking for potential hardcoded credentials..."
        grep -rn "password.*=" . --include="*.rb" | grep -v "MYSQL_PASSWORD" | grep -v "password:" || echo "None found"