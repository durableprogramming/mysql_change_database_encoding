name: Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        ruby-version: ['3.0', '3.1', '3.2', '3.3']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Ruby ${{ matrix.ruby-version }}
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby-version }}
        bundler-cache: true

    # The suite reflects on schema metadata rather than exercising MySQL
    # itself, so it runs against sqlite in memory and needs no database
    # service. See the integration job below for the MySQL coverage.
    - name: Run tests
      run: bundle exec rake test

    - name: Check the CLI starts
      run: bundle exec exe/mysql-change-database-encoding --help

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3'
        bundler-cache: true

    - name: Run RuboCop
      run: bundle exec rubocop

  integration:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:${{ matrix.mysql-version }}
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: test_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    strategy:
      fail-fast: false
      matrix:
        mysql-version: ['5.7', '8.0']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3'
        bundler-cache: true

    - name: Seed a database in a legacy encoding
      run: |
        mysql -h 127.0.0.1 -u root -ppassword -e "
          DROP DATABASE IF EXISTS test_db;
          CREATE DATABASE test_db CHARACTER SET latin1 COLLATE latin1_swedish_ci;
          USE test_db;
          CREATE TABLE with_pk (id INT PRIMARY KEY, name TEXT)
            CHARACTER SET latin1 COLLATE latin1_swedish_ci;
          CREATE TABLE without_pk (name TEXT)
            CHARACTER SET latin1 COLLATE latin1_swedish_ci;
        "

    # pt-online-schema-change is deliberately not installed here, so this
    # exercises the direct ALTER TABLE path end to end against a real server.
    - name: Convert the database to utf8mb4
      run: |
        bundle exec exe/mysql-change-database-encoding \
          --encoding utf8mb4 \
          --collation utf8mb4_unicode_ci \
          --direct-alter-table \
          --no-osc \
          --verbose
      env:
        MYSQL_HOST: 127.0.0.1
        MYSQL_PORT: 3306
        MYSQL_USER: root
        MYSQL_PASSWORD: password
        MYSQL_DATABASE: test_db

    - name: Verify every table was converted
      run: |
        mysql -h 127.0.0.1 -u root -ppassword -Nse "
          SELECT COUNT(*) FROM information_schema.tables
          WHERE table_schema = 'test_db'
            AND table_collation <> 'utf8mb4_unicode_ci';
        " > unconverted.txt
        cat unconverted.txt
        if [ "$(cat unconverted.txt)" != "0" ]; then
          echo "Some tables were not converted to utf8mb4_unicode_ci" >&2
          mysql -h 127.0.0.1 -u root -ppassword -e "
            SELECT table_name, table_collation FROM information_schema.tables
            WHERE table_schema = 'test_db';
          " >&2
          exit 1
        fi
